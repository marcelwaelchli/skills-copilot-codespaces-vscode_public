<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="bw-token" content="{{TOKEN}}">
  <title>Buildwerk</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/app.css">
  <script src="/js/theme-init.js"></script>
</head>
<body>
  <div id="app">
    <header id="topbar"></header>
    <main id="workbench">
      <aside id="palette" class="panel" aria-label="Operationen"></aside>
      <div class="splitter splitter-v" data-resize="left"></div>
      <section id="center">
        <div id="editor"></div>
        <div class="splitter splitter-h" data-resize="bottom"></div>
        <div id="bottom" class="panel"></div>
      </section>
      <div class="splitter splitter-v" data-resize="right"></div>
      <aside id="props" class="panel" aria-label="Eigenschaften"></aside>
    </main>
    <footer id="statusbar"></footer>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
