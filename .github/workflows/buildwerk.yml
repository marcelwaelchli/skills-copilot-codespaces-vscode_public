name: Buildwerk

# Tests for the tool in buildwerk/. Independent of the course workflows:
# it only runs when something under buildwerk/ (or this file) changes.
on:
  pull_request:
    paths:
      - "buildwerk/**"
      - ".github/workflows/buildwerk.yml"
  push:
    branches:
      - main
    paths:
      - "buildwerk/**"
      - ".github/workflows/buildwerk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buildwerk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 24
    defaults:
      run:
        working-directory: buildwerk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Tests
        run: npm test

      # The tour macro exercises the platform's default shell end to end.
      - name: Rundgang über die Kommandozeile
        run: node bin/buildwerk.js run examples/rundgang.buildwerk.json
